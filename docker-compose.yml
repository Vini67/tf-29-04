version: '3.8'

services:
  postgres:
    image: postgres:latest # Imagem oficial do PostgreSQL
    container_name: postgres_container
    ports:
      - "5432:5432" # Porta local conectada ao container
    environment:
      POSTGRES_USER: admin # Nome do usuário
      POSTGRES_PASSWORD: senha123 # Senha
      POSTGRES_DB: meu_banco # Nome do banco de dados
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistência dos dados

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter_container
    ports:
      - "9187:9187" # Porta onde o exportador estará acessível
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:senha123@postgres_container:5432/meu_banco?sslmode=disable"
    volumes:
      - ./postgres_exporter.yml:/config/postgres_exporter.yml
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_container
    ports:
      - "9090:9090" # Porta para acessar o Prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - postgres_exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_container
    ports:
      - "3000:3000" # Porta para acessar o Grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin # Usuário padrão
      GF_SECURITY_ADMIN_PASSWORD: admin # Senha padrão
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:


